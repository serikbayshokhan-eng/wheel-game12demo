<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>color - Light or Dark Wheel</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #200524;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #1e082e;
    border-radius: 16px;
    padding: 16px;
    max-width: 380px;
    width: 100%;
    border: 1px solid #212f46;
  }
  .title {
    text-align: center;
    color: #cfe0ff;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 1px;
    margin-bottom: 2px;
  }
  .subtitle {
    text-align: center;
    color: #476188;
    font-size: 11px;
    letter-spacing: 1px;
    margin-bottom: 14px;
  }
  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  select {
    flex: 1;
    background: #101d33;
    border: 1px solid #22355a;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12px;
    color: #7fa8d9;
  }
  .choice-label {
    text-align: center;
    font-size: 11px;
    color: #5c7ba8;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .choice-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .choice-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    background: #101d33;
    border: 1px solid #22355a;
    border-radius: 8px;
    padding: 10px 6px;
    cursor: pointer;
    font-size: 11px;
    color: #7fa8d9;
    font-weight: 600;
  }
  .choice-btn .swatch {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1px solid #2a4270;
  }
  .choice-btn.selected {
    border: 1px solid #4aa8ff;
    background: #142645;
    color: #cfe0ff;
  }
  .bet-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }
  .bet-row span {
    font-size: 12px;
    color: #7fa8d9;
  }
  .bet-row input {
    flex: 1;
    background: #101d33;
    border: 1px solid #22355a;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    color: #e7e9ee;
  }
  .balance-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }
  .balance-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #101d33;
    border: 1px solid #22355a;
    border-radius: 8px;
    padding: 6px 12px;
  }
  .balance-pill span {
    font-size: 13px;
    color: #7fa8d9;
  }
  #deposit-btn {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #173156;
    border: none;
    color: #4aa8ff;
    font-size: 13px;
    cursor: pointer;
    line-height: 1;
  }
  .wheel-wrap {
    position: relative;
    width: 100%;
    max-width: 260px;
    margin: 0 auto;
  }
  #wheel {
    width: 100%;
    display: block;
    transition: transform 4s cubic-bezier(0.15,0.85,0.3,1);
  }
  .pointer {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
  }
  #result-msg {
    text-align: center;
    font-size: 13px;
    color: #5c7ba8;
    min-height: 20px;
    margin: 12px 0 6px;
  }
  .spin-row { text-align: center; margin-bottom: 10px; }
  #spin-btn {
    background: #173156;
    color: #cfe0ff;
    border: 1px solid #2a4270;
    font-size: 14px;
    font-weight: 600;
    padding: 12px 44px;
    border-radius: 8px;
    cursor: pointer;
  }
  #spin-btn:disabled { opacity: 0.6; cursor: default; }
  .fast-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .fast-row span { font-size: 11px; color: #5c7ba8; }
  #fast-toggle {
    width: 30px;
    height: 16px;
    border-radius: 8px;
    background: #22355a;
    position: relative;
    border: none;
    cursor: pointer;
  }
  #fast-knob {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #7fa8d9;
    position: absolute;
    top: 2px;
    left: 2px;
    transition: left 0.2s;
  }
  .history-box {
    background: #101d33;
    border: 1px solid #22355a;
    border-radius: 10px;
    padding: 12px 14px;
  }
  .history-label {
    font-size: 11px;
    color: #5c7ba8;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  #history-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 13px;
  }
  .history-row {
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>

<div class="card">
  <div class="title">G PERYA</div>
  <div class="subtitle">LIGHT OR DARK WHEEL</div>

  <div class="controls">
    <select id="speed-select">
      <option value="1">1 second</option>
      <option value="3">3 seconds</option>
      <option value="5">5 seconds</option>
    </select>
  </div>

  <div class="choice-label">CHOOSE YOUR BET</div>
  <div class="choice-row">
    <button class="choice-btn selected" data-type="light">
      <span class="swatch" style="background:#e7e9ee"></span>
      White
    </button>
    <button class="choice-btn" data-type="dark">
      <span class="swatch" style="background:#1c2534"></span>
      Black
    </button>
    <button class="choice-btn" data-type="triple">
      <span class="swatch" style="background:#5b6b93"></span>
      3X
    </button>
  </div>

  <div class="bet-row">
    <span>Bet</span>
    <input id="bet-amount" type="number" value="100" min="10" step="10">
  </div>

  <div class="balance-row">
    <div class="balance-pill">
      <span id="balance">10,000.00</span>
      <button id="deposit-btn" aria-label="Add funds">+</button>
    </div>
  </div>

  <div class="wheel-wrap">
    <svg id="wheel" viewBox="0 0 300 300" role="img" aria-label="Wheel with seven segments">
      <title>Light or Dark wheel</title>
      <desc>Wheel with three light, three dark and one gray 3X segment</desc>
      <defs><path id="seg" d="M150,150 L150,20 A130,130 0 0,1 231.3,54.4 Z"/></defs>
      <circle cx="150" cy="150" r="140" fill="none" stroke="#2a4270" stroke-width="2"/>
      <g stroke="#0a1220" stroke-width="1.5">
        <use href="#seg" fill="#e7e9ee" transform="rotate(0 150 150)"/>
        <use href="#seg" fill="#1c2534" transform="rotate(51.43 150 150)"/>
        <use href="#seg" fill="#e7e9ee" transform="rotate(102.86 150 150)"/>
        <use href="#seg" fill="#1c2534" transform="rotate(154.29 150 150)"/>
        <use href="#seg" fill="#e7e9ee" transform="rotate(205.71 150 150)"/>
        <use href="#seg" fill="#1c2534" transform="rotate(257.14 150 150)"/>
        <use href="#seg" fill="#5b6b93" transform="rotate(308.57 150 150)"/>
      </g>
      <g font-size="10" font-weight="600" text-anchor="middle" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
        <text x="191.2" y="68.4" fill="#1c2534">LIGHT</text>
        <text x="242.6" y="132.9" fill="#cfd6e6">DARK</text>
        <text x="224.3" y="213.1" fill="#1c2534">LIGHT</text>
        <text x="150" y="249" fill="#cfd6e6">DARK</text>
        <text x="75.7" y="213.1" fill="#1c2534">LIGHT</text>
        <text x="57.4" y="132.9" fill="#cfd6e6">DARK</text>
        <text x="108.8" y="68.4" fill="#0a1220" font-size="13">3X</text>
      </g>
      <circle cx="150" cy="150" r="26" fill="#101d33" stroke="#2a4270" stroke-width="2"/>
    </svg>
    <div class="pointer">
      <svg width="18" height="24" viewBox="0 0 18 24"><polygon points="9,0 1,20 17,20" fill="#4aa8ff"/></svg>
    </div>
  </div>

  <div id="result-msg"></div>

  <div class="spin-row">
    <button id="spin-btn">SPIN</button>
  </div>

  <div class="fast-row">
    <span>FAST MODE</span>
    <button id="fast-toggle" aria-label="Toggle fast mode"><div id="fast-knob"></div></button>
  </div>

  <div class="history-box">
    <div class="history-label">GAME HISTORY</div>
    <div id="history-list"></div>
  </div>
</div>

<script>
(function(){
  var balance = 10000;
  var spinning = false;
  var fastMode = false;
  var segments = [
    {label:'Light', type:'light'},
    {label:'Dark',  type:'dark'},
    {label:'Light', type:'light'},
    {label:'Dark',  type:'dark'},
    {label:'Light', type:'light'},
    {label:'Dark',  type:'dark'},
    {label:'3X',    type:'triple'}
  ];
  var segAngle = 360/7;
  var currentRotation = 0;

  function fmt(n){ return Math.round(n).toLocaleString('en-US'); }

  function updateBalance(){
    document.getElementById('balance').textContent = fmt(balance) + '.00';
  }

  function addHistory(entry){
    var list = document.getElementById('history-list');
    var row = document.createElement('div');
    row.className = 'history-row';
    var nameSpan = document.createElement('span');
    nameSpan.textContent = entry.label;
    nameSpan.style.color = entry.type === 'triple' ? '#7f8fb5' : (entry.type === 'light' ? '#e7e9ee' : '#cfd6e6');
    var amtSpan = document.createElement('span');
    amtSpan.textContent = (entry.amount >= 0 ? '+' : '') + fmt(entry.amount);
    amtSpan.style.color = entry.amount >= 0 ? '#4aa8ff' : '#5b6b93';
    row.appendChild(nameSpan);
    row.appendChild(amtSpan);
    list.insertBefore(row, list.firstChild);
    while(list.children.length > 6){ list.removeChild(list.lastChild); }
  }

  document.getElementById('deposit-btn').addEventListener('click', function(){
    balance += 1000;
    updateBalance();
    var msg = document.getElementById('result-msg');
    msg.textContent = 'Balance topped up by 1,000';
    msg.style.color = '#4aa8ff';
  });

  var selectedBet = 'light';
  var choiceButtons = document.querySelectorAll('.choice-btn');
  choiceButtons.forEach(function(btn){
    btn.addEventListener('click', function(){
      choiceButtons.forEach(function(b){ b.classList.remove('selected'); });
      btn.classList.add('selected');
      selectedBet = btn.getAttribute('data-type');
    });
  });

  document.getElementById('fast-toggle').addEventListener('click', function(){
    fastMode = !fastMode;
    var knob = document.getElementById('fast-knob');
    knob.style.left = fastMode ? '16px' : '2px';
    this.style.background = fastMode ? '#2a5fa8' : '#22355a';
  });

  document.getElementById('spin-btn').addEventListener('click', function(){
    if (spinning) return;
    var bet = parseFloat(document.getElementById('bet-amount').value) || 0;
    var msg = document.getElementById('result-msg');
    if (bet <= 0) {
      msg.textContent = 'Enter a bet amount';
      msg.style.color = '#5b6b93';
      return;
    }
    if (bet > balance) {
      msg.textContent = 'Not enough balance';
      msg.style.color = '#5b6b93';
      return;
    }
    spinning = true;
    var betType = selectedBet;
    var speedSel = parseInt(document.getElementById('speed-select').value, 10);
    var duration = fastMode ? 1.2 : (1 + speedSel * 0.6);

    var winIndex = Math.floor(Math.random() * segments.length);
    var seg = segments[winIndex];

    var targetAngleInWheel = winIndex * segAngle + segAngle/2;
    var extraSpins = fastMode ? 3 : 5;
    var finalRotation = currentRotation - (currentRotation % 360) + 360*extraSpins + (360 - targetAngleInWheel);
    var wheel = document.getElementById('wheel');
    wheel.style.transition = 'transform ' + duration + 's cubic-bezier(0.15,0.85,0.3,1)';
    wheel.style.transform = 'rotate(' + finalRotation + 'deg)';
    currentRotation = finalRotation;

    balance -= bet;
    msg.textContent = 'Spinning...';
    msg.style.color = '#5c7ba8';
    var spinBtn = document.getElementById('spin-btn');
    spinBtn.disabled = true;

    setTimeout(function(){
      var won = (betType === seg.type);
      var payout = 0;
      if (won) {
        payout = bet * (seg.type === 'triple' ? 6 : 2);
        balance += payout;
        msg.textContent = 'Result: ' + seg.label + ' — you won ' + fmt(payout);
        msg.style.color = '#4aa8ff';
      } else {
        msg.textContent = 'Result: ' + seg.label + ' — you lost';
        msg.style.color = '#5b6b93';
      }
      addHistory({label: seg.label, type: seg.type, amount: won ? payout : -bet});
      updateBalance();
      spinning = false;
      spinBtn.disabled = false;
    }, duration * 1000 + 50);
  });

  updateBalance();
})();
</script>

</body>
</html>
