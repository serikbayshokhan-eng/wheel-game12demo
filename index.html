<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G PERYA — Virtual Wheel</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #4b0b57, #200524 55%, #100112);
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}

.app {
    width: 100%;
    max-width: 480px;
    margin: auto;
    padding: 18px 14px 35px;
}

.header {
    text-align: center;
    margin-bottom: 18px;
}

.logo {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 3px;
}

.subtitle {
    color: #cba8d2;
    font-size: 12px;
    margin-top: 4px;
}

.card {
    background: rgba(42, 7, 49, .9);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 22px;
    padding: 18px;
    box-shadow: 0 15px 45px rgba(0,0,0,.4);
}

/* БАЛАНС */

.balance-box {
    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 16px;
    padding: 15px;
    margin-bottom: 18px;
}

.balance-label {
    color: #bda3c3;
    font-size: 12px;
    text-align: center;
}

.balance {
    text-align: center;
    font-size: 32px;
    font-weight: 900;
    margin: 4px 0 12px;
}

.balance-buttons {
    display: flex;
    gap: 8px;
}

.balance-buttons button {
    flex: 1;
    border: 0;
    border-radius: 11px;
    padding: 11px 5px;
    color: white;
    font-weight: 800;
    cursor: pointer;
}

.bonus-btn {
    background: linear-gradient(135deg, #9d30c0, #671587);
}

.reset-btn {
    background: rgba(255,255,255,.09);
}

/* КОЛЕСО */

.wheel-area {
    position: relative;
    width: min(90vw, 390px);
    aspect-ratio: 1;
    margin: 0 auto 20px;
}

.wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    position: relative;

    border: 5px solid #ead0ef;

    box-shadow:
        0 0 0 5px #5c1768,
        0 15px 35px rgba(0,0,0,.55);

    transition:
        transform 4s cubic-bezier(.12,.75,.18,1);
}

/*
   СЕКТОРА БЕЗ ПРОМЕЖУТКОВ
*/

.wheel-cell {
    position: absolute;
    width: 50.3%;
    height: 50.3%;
    left: 50%;
    top: 50%;

    transform-origin: 0 0;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    overflow: hidden;
}

.wheel-cell span {
    position: absolute;
    left: 25%;
    top: 27%;
    width: 72%;

    text-align: center;

    font-size: 17px;
    font-weight: 900;

    transform: rotate(22.5deg);

    text-shadow: 0 2px 5px rgba(0,0,0,.7);
}

/* ОБВОДКА СЕКТОРОВ */

.wheel-cell::after {
    content: "";
    position: absolute;
    inset: 0;

    border-left: 1px solid rgba(255,255,255,.65);

    pointer-events: none;
}

.cell1 {
    transform: rotate(0deg) skewY(-45deg);
    background: #7d1fa3;
}

.cell2 {
    transform: rotate(45deg) skewY(-45deg);
    background: #a932c4;
}

.cell3 {
    transform: rotate(90deg) skewY(-45deg);
    background: #5d1b9d;
}

.cell4 {
    transform: rotate(135deg) skewY(-45deg);
    background: #922bb0;
}

.cell5 {
    transform: rotate(180deg) skewY(-45deg);
    background: #6f2392;
}

.cell6 {
    transform: rotate(225deg) skewY(-45deg);
    background: #b138c7;
}

.cell7 {
    transform: rotate(270deg) skewY(-45deg);
    background: #552080;
}

.cell8 {
    transform: rotate(315deg) skewY(-45deg);
    background: #8726a9;
}

/* СИНИЙ УКАЗАТЕЛЬ */

.pointer {
    position: absolute;
    z-index: 30;

    top: -7px;
    left: 50%;

    transform:
        translateX(-50%)
        rotate(180deg);

    width: 0;
    height: 0;

    border-left: 17px solid transparent;
    border-right: 17px solid transparent;
    border-top: 34px solid #20a9ff;

    filter:
        drop-shadow(0 0 6px #20a9ff)
        drop-shadow(0 3px 5px rgba(0,0,0,.6));
}

/* ЦЕНТР */

.center {
    position: absolute;
    z-index: 20;

    width: 82px;
    height: 82px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;
    border: 5px solid #f0d8f5;

    background: radial-gradient(circle, #9d35ba, #55106a);

    box-shadow:
        0 0 0 5px #4c0e59,
        0 5px 20px rgba(0,0,0,.5);

    display: flex;
    align-items: center;
    justify-content: center;

    font-weight: 900;
    font-size: 13px;
}

/* РЕЗУЛЬТАТ */

.result {
    min-height: 58px;

    border-radius: 15px;

    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.1);

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    margin-bottom: 13px;
}

.result-text {
    font-size: 17px;
    font-weight: 800;
}

/* КНОПКА */

.spin-btn {
    width: 100%;

    border: 0;
    border-radius: 15px;

    padding: 16px;

    background: linear-gradient(135deg, #9c2fc0, #6d1690);

    color: white;

    font-size: 18px;
    font-weight: 900;

    cursor: pointer;
}

.spin-btn:disabled {
    opacity: .5;
}

/* ИСТОРИЯ */

.history {
    margin-top: 20px;
}

.history-title {
    font-weight: 900;
    margin-bottom: 9px;
}

.history-list {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.history-item {
    background: rgba(255,255,255,.05);
    border-radius: 11px;
    padding: 10px 12px;

    display: flex;
    justify-content: space-between;

    color: #decbe2;
    font-size: 13px;
}

.info {
    text-align: center;
    margin-top: 14px;

    color: #a88cab;
    font-size: 11px;
    line-height: 1.5;
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="logo">G PERYA</div>
        <div class="subtitle">VIRTUAL WHEEL</div>
    </div>

    <div class="card">

        <!-- ВИРТУАЛЬНЫЙ БАЛАНС -->

        <div class="balance-box">

            <div class="balance-label">
                ВИРТУАЛЬНЫЙ БАЛАНС
            </div>

            <div class="balance" id="balance">
                0.00
            </div>

            <div class="balance-buttons">

                <button
                    class="bonus-btn"
                    id="bonusButton">
                    + БОНУС
                </button>

                <button
                    class="reset-btn"
                    id="resetButton">
                    СБРОС
                </button>

            </div>

        </div>


        <!-- КОЛЕСО -->

        <div class="wheel-area">

            <div class="pointer"></div>

            <div class="wheel" id="wheel">

                <div class="wheel-cell cell1">
                    <span>+10</span>
                </div>

                <div class="wheel-cell cell2">
                    <span>+25</span>
                </div>

                <div class="wheel-cell cell3">
                    <span>+50</span>
                </div>

                <div class="wheel-cell cell4">
                    <span>+5</span>
                </div>

                <div class="wheel-cell cell5">
                    <span>+100</span>
                </div>

                <div class="wheel-cell cell6">
                    <span>+15</span>
                </div>

                <div class="wheel-cell cell7">
                    <span>+30</span>
                </div>

                <div class="wheel-cell cell8">
                    <span>+75</span>
                </div>

            </div>

            <div class="center">
                КРУТИ
            </div>

        </div>


        <!-- РЕЗУЛЬТАТ -->

        <div class="result">

            <div
                class="result-text"
                id="result">
                Нажми «КРУТИТЬ»
            </div>

        </div>


        <button
            class="spin-btn"
            id="spinButton">
            КРУТИТЬ
        </button>


        <div class="history">

            <div class="history-title">
                История
            </div>

            <div
                class="history-list"
                id="history">
            </div>

        </div>


        <div class="info">
            В этой версии используются только игровые единицы.
            Кнопка «БОНУС» бесплатно начисляет игровые единицы.
        </div>

    </div>

</div>


<script>

/* =========================
   СОСТОЯНИЕ
   ========================= */

let balance = 0;
let rotation = 0;
let spinning = false;


/* Значения секторов */

const prizes = [
    10,
    25,
    50,
    5,
    100,
    15,
    30,
    75
];


const wheel =
    document.getElementById("wheel");

const balanceElement =
    document.getElementById("balance");

const result =
    document.getElementById("result");

const spinButton =
    document.getElementById("spinButton");

const bonusButton =
    document.getElementById("bonusButton");

const resetButton =
    document.getElementById("resetButton");

const history =
    document.getElementById("history");


/* =========================
   БАЛАНС
   ========================= */

function updateBalance() {

    /*
       Никаких NaN.
       Всегда выводим нормальное число.
    */

    const safeBalance =
        Number(balance) || 0;

    balanceElement.textContent =
        safeBalance.toFixed(2);
}


/* =========================
   БЕСПЛАТНЫЙ БОНУС
   ========================= */

bonusButton.addEventListener(
    "click",
    function() {

        const bonus = 100;

        balance += bonus;

        updateBalance();

        result.textContent =
            `Бонус: +${bonus}.00 игровых единиц`;

        addHistory(
            `Бесплатный бонус +${bonus}.00`
        );
    }
);


/* =========================
   СБРОС
   ========================= */

resetButton.addEventListener(
    "click",
    function() {

        balance = 0;

        updateBalance();

        result.textContent =
            "Баланс сброшен";

        addHistory(
            "Баланс сброшен"
        );
    }
);


/* =========================
   КРУЧЕНИЕ
   ========================= */

spinButton.addEventListener(
    "click",
    spin
);


function spin() {

    if (spinning) {
        return;
    }

    spinning = true;

    spinButton.disabled = true;

    result.textContent =
        "Колесо крутится...";


    /*
       Выбираем сектор.
    */

    const index =
        Math.floor(
            Math.random() * prizes.length
        );


    const prize =
        Number(prizes[index]) || 0;


    /*
       Каждый сектор = 45 градусов.
    */

    const sectorAngle = 45;


    /*
       Добавляем 6 полных оборотов.
    */

    const target =
        360 -
        (
            index * sectorAngle +
            sectorAngle / 2
        );


    rotation +=
        360 * 6 +
        target;


    wheel.style.transform =
        `rotate(${rotation}deg)`;


    setTimeout(
        function() {

            /*
               Добавляем игровые единицы.
            */

            balance += prize;

            updateBalance();


            result.textContent =
                `Выпало +${prize}.00`;


            addHistory(
                `Колесо +${prize}.00`
            );


            spinning = false;

            spinButton.disabled = false;

        },
        4100
    );
}


/* =========================
   ИСТОРИЯ
   ========================= */

function addHistory(text) {

    const item =
        document.createElement("div");

    item.className =
        "history-item";


    const time =
        new Date().toLocaleTimeString(
            "ru-RU",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


    item.innerHTML = `
        <span>${text}</span>
        <span>${time}</span>
    `;


    history.prepend(item);


    /*
       Максимум 10 записей.
    */

    while (
        history.children.length > 10
    ) {

        history.removeChild(
            history.lastChild
        );

    }
}


/*
   Запускаем с корректным балансом.
*/

updateBalance();

</script>

</body>
</html>
