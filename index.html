<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G PERYA — Virtual Wheel</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #200524;
  font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

button,
input,
select {
  font-family: inherit;
}

/* =========================
   AUTH
========================= */

.auth-card {
  background: #1e082e;
  border-radius: 16px;
  padding: 24px;
  max-width: 380px;
  width: 100%;
  border: 1px solid #212f46;
}

.auth-title {
  text-align: center;
  color: #cfe0ff;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 2px;
  margin-bottom: 5px;
}

.auth-subtitle {
  text-align: center;
  color: #476188;
  font-size: 11px;
  letter-spacing: 1px;
  margin-bottom: 24px;
}

.auth-input {
  width: 100%;
  background: #101d33;
  border: 1px solid #22355a;
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 10px;
  color: #e7e9ee;
  outline: none;
}

.auth-input:focus {
  border-color: #4aa8ff;
}

.auth-btn {
  width: 100%;
  background: #173156;
  color: #cfe0ff;
  border: 1px solid #2a4270;
  border-radius: 8px;
  padding: 12px;
  cursor: pointer;
  font-weight: 600;
  margin-top: 5px;
}

.auth-btn:hover {
  background: #21436f;
}

.auth-switch {
  text-align: center;
  color: #5c7ba8;
  font-size: 12px;
  margin-top: 16px;
  cursor: pointer;
}

.auth-switch:hover {
  color: #4aa8ff;
}

.auth-message {
  text-align: center;
  min-height: 18px;
  font-size: 12px;
  margin-top: 10px;
}

/* =========================
   GAME
========================= */

.card {
  background: #1e082e;
  border-radius: 16px;
  padding: 16px;
  max-width: 380px;
  width: 100%;
  border: 1px solid #212f46;
}

.top-user {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}

.user-name {
  color: #7fa8d9;
  font-size: 12px;
}

.logout-btn {
  background: #101d33;
  border: 1px solid #22355a;
  color: #7fa8d9;
  border-radius: 7px;
  padding: 6px 10px;
  font-size: 11px;
  cursor: pointer;
}

.logout-btn:hover {
  border-color: #4aa8ff;
  color: #cfe0ff;
}

.title {
  text-align: center;
  color: #cfe0ff;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 1px;
  margin-bottom: 2px;
}

.subtitle {
  text-align: center;
  color: #476188;
  font-size: 11px;
  letter-spacing: 1px;
  margin-bottom: 14px;
}

.controls {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}

select {
  flex: 1;
  background: #101d33;
  border: 1px solid #22355a;
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 12px;
  color: #7fa8d9;
}

.choice-label {
  text-align: center;
  font-size: 11px;
  color: #5c7ba8;
  letter-spacing: 1px;
  margin-bottom: 8px;
}

.choice-row {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}

.choice-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  background: #101d33;
  border: 1px solid #22355a;
  border-radius: 8px;
  padding: 10px 6px;
  cursor: pointer;
  font-size: 11px;
  color: #7fa8d9;
  font-weight: 600;
}

.choice-btn .swatch {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 1px solid #2a4270;
}

.choice-btn.selected {
  border: 1px solid #4aa8ff;
  background: #142645;
  color: #cfe0ff;
}

.bet-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
}

.bet-row span {
  font-size: 12px;
  color: #7fa8d9;
}

.bet-row input {
  flex: 1;
  background: #101d33;
  border: 1px solid #22355a;
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 13px;
  color: #e7e9ee;
  outline: none;
}

.bet-row input:focus {
  border-color: #4aa8ff;
}

.balance-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
}

.balance-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #101d33;
  border: 1px solid #22355a;
  border-radius: 8px;
  padding: 6px 12px;
}

.balance-pill span {
  font-size: 13px;
  color: #7fa8d9;
}

#deposit-btn {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #173156;
  border: none;
  color: #4aa8ff;
  font-size: 13px;
  cursor: pointer;
  line-height: 1;
}

.wheel-wrap {
  position: relative;
  width: 100%;
  max-width: 260px;
  margin: 0 auto;
}

#wheel {
  width: 100%;
  display: block;
  transition: transform 4s cubic-bezier(0.15,0.85,0.3,1);
}

.pointer {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
}

#result-msg {
  text-align: center;
  font-size: 13px;
  color: #5c7ba8;
  min-height: 20px;
  margin: 12px 0 6px;
}

.spin-row {
  text-align: center;
  margin-bottom: 10px;
}

#spin-btn {
  background: #173156;
  color: #cfe0ff;
  border: 1px solid #2a4270;
  font-size: 14px;
  font-weight: 600;
  padding: 12px 44px;
  border-radius: 8px;
  cursor: pointer;
}

#spin-btn:disabled {
  opacity: 0.6;
  cursor: default;
}

.fast-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 16px;
}

.fast-row span {
  font-size: 11px;
  color: #5c7ba8;
}

#fast-toggle {
  width: 30px;
  height: 16px;
  border-radius: 8px;
  background: #22355a;
  position: relative;
  border: none;
  cursor: pointer;
}

#fast-knob {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #7fa8d9;
  position: absolute;
  top: 2px;
  left: 2px;
  transition: left 0.2s;
}

.history-box {
  background: #101d33;
  border: 1px solid #22355a;
  border-radius: 10px;
  padding: 12px 14px;
}

.history-label {
  font-size: 11px;
  color: #5c7ba8;
  margin-bottom: 8px;
  letter-spacing: 1px;
}

#history-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 13px;
}

.history-row {
  display: flex;
  justify-content: space-between;
}

.demo-note {
  text-align: center;
  color: #476188;
  font-size: 9px;
  margin-top: 12px;
}
</style>
</head>

<body>

<!-- =========================
     LOGIN / REGISTER
========================= -->

<div class="auth-card" id="auth-screen">

  <div class="auth-title">G PERYA</div>

  <div class="auth-subtitle">
    VIRTUAL WHEEL
  </div>

  <input
    id="username-input"
    class="auth-input"
    type="text"
    placeholder="Username"
    maxlength="20"
  >

  <input
    id="password-input"
    class="auth-input"
    type="password"
    placeholder="Password"
    maxlength="30"
  >

  <button class="auth-btn" id="auth-btn">
    LOGIN
  </button>

  <div class="auth-switch" id="auth-switch">
    Don't have an account? Register
  </div>

  <div class="auth-message" id="auth-message"></div>

</div>


<!-- =========================
     GAME
========================= -->

<div class="card" id="game-screen" style="display:none;">

  <div class="top-user">
    <div class="user-name">
      Account: <span id="current-user"></span>
    </div>

    <button class="logout-btn" id="logout-btn">
      LOG OUT
    </button>
  </div>

  <div class="title">
    G PERYA
  </div>

  <div class="subtitle">
    LIGHT OR DARK WHEEL
  </div>

  <div class="controls">
    <select id="speed-select">
      <option value="1">1 second</option>
      <option value="3">3 seconds</option>
      <option value="5">5 seconds</option>
    </select>
  </div>

  <div class="choice-label">
    CHOOSE YOUR BET
  </div>

  <div class="choice-row">

    <button class="choice-btn selected" data-type="light">
      <span class="swatch" style="background:#e7e9ee"></span>
      White
    </button>

    <button class="choice-btn" data-type="dark">
      <span class="swatch" style="background:#1c2534"></span>
      Black
    </button>

    <button class="choice-btn" data-type="triple">
      <span class="swatch" style="background:#5b6b93"></span>
      3X
    </button>

  </div>

  <div class="bet-row">
    <span>Bet</span>

    <input
      id="bet-amount"
      type="number"
      value="100"
      min="10"
      step="10"
    >
  </div>

  <div class="balance-row">

    <div class="balance-pill">

      <span id="balance">
        10,000.00
      </span>

      <button id="deposit-btn" aria-label="Add virtual points">
        +
      </button>

    </div>

  </div>


  <!-- WHEEL -->

  <div class="wheel-wrap">

    <svg
      id="wheel"
      viewBox="0 0 300 300"
      role="img"
      aria-label="Virtual wheel"
    >

      <title>Light or Dark wheel</title>

      <desc>
        Virtual wheel with light, dark and 3X segments
      </desc>

      <defs>
        <path
          id="seg"
          d="M150,150 L150,20 A130,130 0 0,1 231.3,54.4 Z"
        />
      </defs>

      <circle
        cx="150"
        cy="150"
        r="140"
        fill="none"
        stroke="#2a4270"
        stroke-width="2"
      />

      <g stroke="#0a1220" stroke-width="1.5">

        <use href="#seg"
             fill="#e7e9ee"
             transform="rotate(0 150 150)"/>

        <use href="#seg"
             fill="#1c2534"
             transform="rotate(51.43 150 150)"/>

        <use href="#seg"
             fill="#e7e9ee"
             transform="rotate(102.86 150 150)"/>

        <use href="#seg"
             fill="#1c2534"
             transform="rotate(154.29 150 150)"/>

        <use href="#seg"
             fill="#e7e9ee"
             transform="rotate(205.71 150 150)"/>

        <use href="#seg"
             fill="#1c2534"
             transform="rotate(257.14 150 150)"/>

        <use href="#seg"
             fill="#5b6b93"
             transform="rotate(308.57 150 150)"/>

      </g>

      <g
        font-size="10"
        font-weight="600"
        text-anchor="middle"
        font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif"
      >

        <text x="191.2" y="68.4" fill="#1c2534">
          LIGHT
        </text>

        <text x="242.6" y="132.9" fill="#cfd6e6">
          DARK
        </text>

        <text x="224.3" y="213.1" fill="#1c2534">
          LIGHT
        </text>

        <text x="150" y="249" fill="#cfd6e6">
          DARK
        </text>

        <text x="75.7" y="213.1" fill="#1c2534">
          LIGHT
        </text>

        <text x="57.4" y="132.9" fill="#cfd6e6">
          DARK
        </text>

        <text
          x="108.8"
          y="68.4"
          fill="#0a1220"
          font-size="13"
        >
          3X
        </text>

      </g>

      <circle
        cx="150"
        cy="150"
        r="26"
        fill="#101d33"
        stroke="#2a4270"
        stroke-width="2"
      />

    </svg>

    <div class="pointer">

      <svg
        width="18"
        height="24"
        viewBox="0 0 18 24"
      >

        <polygon
          points="9,0 1,20 17,20"
          fill="#4aa8ff"
        />

      </svg>

    </div>

  </div>


  <div id="result-msg"></div>


  <div class="spin-row">

    <button id="spin-btn">
      SPIN
    </button>

  </div>


  <div class="fast-row">

    <span>
      FAST MODE
    </span>

    <button
      id="fast-toggle"
      aria-label="Toggle fast mode"
    >
      <div id="fast-knob"></div>
    </button>

  </div>


  <div class="history-box">

    <div class="history-label">
      GAME HISTORY
    </div>

    <div id="history-list"></div>

  </div>


  <div class="demo-note">
    DEMO VERSION — VIRTUAL POINTS ONLY
  </div>

</div>


<script>

(function(){

  /* =========================
     ACCOUNT SYSTEM
  ========================= */

  var authScreen = document.getElementById('auth-screen');
  var gameScreen = document.getElementById('game-screen');

  var usernameInput = document.getElementById('username-input');
  var passwordInput = document.getElementById('password-input');

  var authBtn = document.getElementById('auth-btn');
  var authSwitch = document.getElementById('auth-switch');
  var authMessage = document.getElementById('auth-message');

  var currentUser = null;
  var registerMode = false;


  function getAccounts(){

    try {

      return JSON.parse(
        localStorage.getItem('gPeryaAccounts')
      ) || {};

    } catch(e){

      return {};

    }

  }


  function saveAccounts(accounts){

    localStorage.setItem(
      'gPeryaAccounts',
      JSON.stringify(accounts)
    );

  }


  function showMessage(text, color){

    authMessage.textContent = text;
    authMessage.style.color = color;

  }


  function showRegister(){

    registerMode = true;

    authBtn.textContent = 'REGISTER';

    authSwitch.textContent =
      'Already have an account? Login';

    showMessage('', '#476188');

  }


  function showLogin(){

    registerMode = false;

    authBtn.textContent = 'LOGIN';

    authSwitch.textContent =
      "Don't have an account? Register";

    showMessage('', '#476188');

  }


  authSwitch.addEventListener('click', function(){

    if(registerMode){

      showLogin();

    } else {

      showRegister();

    }

  });


  authBtn.addEventListener('click', function(){

    var username =
      usernameInput.value.trim();

    var password =
      passwordInput.value;

    if(username.length < 3){

      showMessage(
        'Username must contain at least 3 characters',
        '#5b6b93'
      );

      return;

    }

    if(password.length < 4){

      showMessage(
        'Password must contain at least 4 characters',
        '#5b6b93'
      );

      return;

    }


    var accounts = getAccounts();


    /* REGISTER */

    if(registerMode){

      if(accounts[username]){

        showMessage(
          'This username already exists',
          '#5b6b93'
        );

        return;

      }


      accounts[username] = {

        password: password,

        balance: 10000,

        history: []

      };


      saveAccounts(accounts);

      usernameInput.value = '';
      passwordInput.value = '';

      showLogin();

      showMessage(
        'Account created! Now login.',
        '#4aa8ff'
      );

      return;

    }


    /* LOGIN */

    if(!accounts[username]){

      showMessage(
        'Account not found',
        '#5b6b93'
      );

      return;

    }


    if(accounts[username].password !== password){

      showMessage(
        'Incorrect password',
        '#5b6b93'
      );

      return;

    }


    currentUser = username;

    localStorage.setItem(
      'gPeryaCurrentUser',
      currentUser
    );

    usernameInput.value = '';
    passwordInput.value = '';

    openGame();

  });


  /* =========================
     GAME DATA
  ========================= */

  var balance = 10000;

  var spinning = false;

  var fastMode = false;

  var selectedBet = 'light';

  var currentRotation = 0;


  var segments = [

    {
      label:'Light',
      type:'light'
    },

    {
      label:'Dark',
      type:'dark'
    },

    {
      label:'Light',
      type:'light'
    },

    {
      label:'Dark',
      type:'dark'
    },

    {
      label:'Light',
      type:'light'
    },

    {
      label:'Dark',
      type:'dark'
    },

    {
      label:'3X',
      type:'triple'
    }

  ];


  var segAngle = 360 / 7;


  function getCurrentAccount(){

    var accounts = getAccounts();

    return accounts[currentUser];

  }


  function saveCurrentAccount(){

    var accounts = getAccounts();

    if(!accounts[currentUser]){
      return;
    }

    accounts[currentUser].balance = balance;

    saveAccounts(accounts);

  }


  function fmt(n){

    return Math.round(n)
      .toLocaleString('en-US');

  }


  function updateBalance(){

    document.getElementById(
      'balance'
    ).textContent =
      fmt(balance) + '.00';

  }


  function loadHistory(){

    var account =
      getCurrentAccount();

    var list =
      document.getElementById(
        'history-list'
      );

    list.innerHTML = '';

    if(!account || !account.history){
      return;
    }


    account.history
      .slice(0, 6)
      .forEach(function(entry){

        addHistoryToScreen(entry);

      });

  }


  function addHistoryToScreen(entry){

    var list =
      document.getElementById(
        'history-list'
      );

    var row =
      document.createElement('div');

    row.className =
      'history-row';


    var nameSpan =
      document.createElement('span');

    nameSpan.textContent =
      entry.label;


    if(entry.type === 'triple'){

      nameSpan.style.color =
        '#7f8fb5';

    }

    else if(entry.type === 'light'){

      nameSpan.style.color =
        '#e7e9ee';

    }

    else {

      nameSpan.style.color =
        '#cfd6e6';

    }


    var amtSpan =
      document.createElement('span');

    amtSpan.textContent =
      (entry.amount >= 0 ? '+' : '') +
      fmt(entry.amount);


    amtSpan.style.color =
      entry.amount >= 0
        ? '#4aa8ff'
        : '#5b6b93';


    row.appendChild(nameSpan);

    row.appendChild(amtSpan);

    list.appendChild(row);

  }


  function addHistory(entry){

    var account =
      getCurrentAccount();

    if(!account){
      return;
    }

    if(!account.history){
      account.history = [];
    }


    account.history.unshift(entry);

    account.history =
      account.history.slice(0, 6);


    var accounts =
      getAccounts();

    accounts[currentUser] =
      account;

    saveAccounts(accounts);


    loadHistory();

  }


  /* =========================
     LOGOUT
  ========================= */

  document.getElementById(
    'logout-btn'
  ).addEventListener(
    'click',
    function(){

      if(spinning){
        return;
      }

      currentUser = null;

      localStorage.removeItem(
        'gPeryaCurrentUser'
      );

      gameScreen.style.display =
        'none';

      authScreen.style.display =
        'block';

      showLogin();

    }
  );


  /* =========================
     OPEN GAME
  ========================= */

  function openGame(){

    var account =
      getCurrentAccount();

    if(!account){
      return;
    }


    balance =
      Number(account.balance);


    document.getElementById(
      'current-user'
    ).textContent =
      currentUser;


    updateBalance();

    loadHistory();


    authScreen.style.display =
      'none';

    gameScreen.style.display =
      'block';


    document.getElementById(
      'result-msg'
    ).textContent =
      '';

  }


  /* =========================
     AUTO LOGIN
  ========================= */

  var savedUser =
    localStorage.getItem(
      'gPeryaCurrentUser'
    );


  if(savedUser){

    var accounts =
      getAccounts();

    if(accounts[savedUser]){

      currentUser =
        savedUser;

      openGame();

    }

  }


  /* =========================
     VIRTUAL TOP UP
  ========================= */

  document.getElementById(
    'deposit-btn'
  ).addEventListener(
    'click',
    function(){

      if(!currentUser){
        return;
      }


      balance += 1000;

      saveCurrentAccount();

      updateBalance();


      var msg =
        document.getElementById(
          'result-msg'
        );


      msg.textContent =
        '+1,000 virtual points';

      msg.style.color =
        '#4aa8ff';

    }
  );


  /* =========================
     CHOICE BUTTONS
  ========================= */

  var choiceButtons =
    document.querySelectorAll(
      '.choice-btn'
    );


  choiceButtons.forEach(
    function(btn){

      btn.addEventListener(
        'click',
        function(){

          choiceButtons.forEach(
            function(b){

              b.classList.remove(
                'selected'
              );

            }
          );


          btn.classList.add(
            'selected'
          );


          selectedBet =
            btn.getAttribute(
              'data-type'
            );

        }
      );

    }
  );


  /* =========================
     FAST MODE
  ========================= */

  document.getElementById(
    'fast-toggle'
  ).addEventListener(
    'click',
    function(){

      fastMode =
        !fastMode;


      var knob =
        document.getElementById(
          'fast-knob'
        );


      knob.style.left =
        fastMode
          ? '16px'
          : '2px';


      this.style.background =
        fastMode
          ? '#2a5fa8'
          : '#22355a';

    }
  );


  /* =========================
     SPIN
  ========================= */

  document.getElementById(
    'spin-btn'
  ).addEventListener(
    'click',
    function(){

      if(spinning){
        return;
      }


      var bet =
        parseFloat(
          document.getElementById(
            'bet-amount'
          ).value
        ) || 0;


      var msg =
        document.getElementById(
          'result-msg'
        );


      if(bet <= 0){

        msg.textContent =
          'Enter a bet amount';

        msg.style.color =
          '#5b6b93';

        return;

      }


      if(bet < 10){

        msg.textContent =
          'Minimum bet is 10 virtual points';

        msg.style.color =
          '#5b6b93';

        return;

      }


      if(bet > balance){

        msg.textContent =
          'Not enough virtual points';

        msg.style.color =
          '#5b6b93';

        return;

      }


      spinning = true;


      var betType =
        selectedBet;


      var speedSel =
        parseInt(
          document.getElementById(
            'speed-select'
          ).value,
          10
        );


      var duration =
        fastMode
          ? 1.2
          : (1 + speedSel * 0.6);


      /* RANDOM RESULT */

      var winIndex =
        Math.floor(
          Math.random() *
          segments.length
        );


      var seg =
        segments[winIndex];


      var targetAngleInWheel =
        winIndex * segAngle +
        segAngle / 2;


      var extraSpins =
        fastMode ? 3 : 5;


      var finalRotation =
        currentRotation -
        (currentRotation % 360) +
        360 * extraSpins +
        (360 - targetAngleInWheel);


      var wheel =
        document.getElementById(
          'wheel'
        );


      wheel.style.transition =
        'transform ' +
        duration +
        's cubic-bezier(0.15,0.85,0.3,1)';


      wheel.style.transform =
        'rotate(' +
        finalRotation +
        'deg)';


      currentRotation =
        finalRotation;


      /* REMOVE BET */

      balance -= bet;

      saveCurrentAccount();

      updateBalance();


      msg.textContent =
        'Spinning...';

      msg.style.color =
        '#5c7ba8';


      var spinBtn =
        document.getElementById(
          'spin-btn'
        );


      spinBtn.disabled =
        true;


      /* RESULT */

      setTimeout(
        function(){

          var won =
            betType === seg.type;


          var payout = 0;


          if(won){

            payout =
              bet *
              (
                seg.type === 'triple'
                  ? 6
                  : 2
              );


            balance += payout;


            msg.textContent =
              'Result: ' +
              seg.label +
              ' — +' +
              fmt(payout);


            msg.style.color =
              '#4aa8ff';

          }

          else {

            msg.textContent =
              'Result: ' +
              seg.label +
              ' — lost ' +
              fmt(bet);


            msg.style.color =
              '#5b6b93';

          }


          addHistory({

            label: seg.label,

            type: seg.type,

            amount:
              won
                ? payout
                : -bet

          });


          saveCurrentAccount();

          updateBalance();


          spinning = false;

          spinBtn.disabled =
            false;


        },
        duration * 1000 + 50
      );

    }
  );


})();

</script>

</body>
</html>
